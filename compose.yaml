services:
  bot:
    build: .
    image: telega-bot:local
    container_name: telega-bot
    restart: unless-stopped
    init: true
    cpus: 0.75
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 64
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    env_file:
      - .env
    environment:
      TELEGA_DB_PATH: /data/downloads.sqlite3
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
